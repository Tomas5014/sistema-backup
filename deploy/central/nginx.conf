# Entrada única: somente HTTPS. Certificados montados em runtime de
# /tls — fora da imagem e do Git.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /usr/share/nginx/html;

    # API na rede interna — nunca exposta diretamente
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    # saúde da API exposta para verificação da stack
    location = /healthz { proxy_pass http://api:8080; }
    location = /readyz  { proxy_pass http://api:8080; }

    # SPA — rotas client-side
    location / {
        try_files $uri $uri/ /index.html;
    }
}
