[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macip-backup-poc"
version = "0.2.1"
description = "Núcleo de execução de backup da MAC IP usando restic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
macip-backup-poc = "macip_backup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
