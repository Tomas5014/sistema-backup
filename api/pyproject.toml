[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macip-backup-api"
version = "0.1.0"
description = "API central do Sistema de Backup MAC IP — cadastro e recebimento de resultados"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
macip-backup-api = "macip_backup_api.app:run"

[tool.setuptools.packages.find]
where = ["src"]
